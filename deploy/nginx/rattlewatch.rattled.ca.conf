# ===========================================================================
# RATTLEWATCH — public MCP + REST edge for rattlewatch.rattled.ca
# ===========================================================================
#
# WHY A SEPARATE VHOST
#   intel.rattled.ca stays the default_server on 80/443 and keeps every
#   honeypot trap. Only requests that actually carry
#   `Host: rattlewatch.rattled.ca` match here, so scanner traffic aimed at the
#   bare IP is completely unaffected.
#
# WHY THE HOST HEADER IS REWRITTEN
#   Cloud Run routes requests by the Host header. Forwarding the public
#   hostname makes the Google frontend answer 404 (verified empirically), so
#   the upstream Host is the service's own run.app name. The public name is
#   preserved in X-Forwarded-Host for logs and attribution.
#
# WHY BUFFERING IS OFF AND TIMEOUTS ARE LONG
#   MCP over streamable HTTP holds a long-lived SSE response open. Buffering
#   would stall the stream and a short read timeout would sever it mid-turn.
#
# TLS is issued by certbot into /etc/letsencrypt/live/rattlewatch.rattled.ca
# and renewed by the certbot systemd timer using the webroot authenticator,
# which is why /.well-known/acme-challenge/ is served on both ports.

resolver 169.254.169.254 valid=300s ipv6=off;

server {
    listen 80;
    listen [::]:80;
    server_name rattlewatch.rattled.ca;

    # Must remain reachable over plain HTTP and must not be redirected, or
    # renewals fail 30 days before expiry.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rattlewatch.rattled.ca;

    ssl_certificate     /etc/letsencrypt/live/rattlewatch.rattled.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rattlewatch.rattled.ca/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Dedicated JSON log. The shared /var/log/nginx/access.log uses the stock
    # combined format with no Host field, so it cannot separate this vhost from
    # the honeypot on the same nginx. Format is defined in
    # /etc/nginx/conf.d/rattlewatch-analytics.conf.
    access_log /var/log/nginx/rattlewatch.access.log rattlewatch_json;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Admin analytics portal.
    #
    # Served as STATIC FILES from disk, never proxied to the application. There
    # is no request handler on this path, so there is no application logic to
    # exploit: no SQL, no template rendering, no deserialisation, no session.
    # Authorisation is enforced by nginx itself against a bcrypt hash.
    #
    # The Content-Security-Policy deliberately omits script-src, so it falls
    # back to default-src 'none' and NO script can run on this page. That is
    # the backstop: the dashboard renders User-Agent strings taken from
    # attacker-controllable request headers, so even if an escaping bug ever let
    # markup through, there would still be no way to execute it.
    # -----------------------------------------------------------------------
    location = /admin {
        return 301 https://$host/admin/;
    }

    location /admin/ {
        alias /var/www/rattlewatch-admin/;
        index index.html;
        autoindex off;
        disable_symlinks on;

        auth_basic           "Rattlewatch Admin";
        auth_basic_user_file /etc/nginx/rattlewatch.htpasswd;

        limit_req      zone=rw_admin burst=20 nodelay;
        limit_req_status 429;

        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location / {
        set $rw_api "verity-api-243195959173.us-central1.run.app";

        proxy_pass https://$rw_api;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;

        # Cloud Run routes by Host; the public hostname returns 404 upstream.
        proxy_set_header Host $rw_api;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived SSE stream for MCP; never buffer it.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
