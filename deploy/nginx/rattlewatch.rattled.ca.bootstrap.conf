# ===========================================================================
# RATTLEWATCH — BOOTSTRAP vhost (plain HTTP only, no TLS yet)
# ===========================================================================
#
# Why this file exists:
#   certbot must answer the HTTP-01 challenge at
#     http://rattlewatch.rattled.ca/.well-known/acme-challenge/<token>
#   before /etc/letsencrypt/live/rattlewatch.rattled.ca/ exists. nginx refuses
#   to start when ssl_certificate points at a missing file, so the TLS server
#   block cannot be installed first. This file bridges that gap.
#
# Install, then run:
#   certbot certonly --webroot -w /var/www/html -d rattlewatch.rattled.ca
# then replace this file with rattlewatch.rattled.ca.conf.

server {
    listen 80;
    listen [::]:80;
    server_name rattlewatch.rattled.ca;

    # certbot's HTTP-01 challenge lives here. Must stay on plain HTTP and must
    # not be redirected while a renewal is in flight.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Temporary proxy, kept only to prove the Cloud Run hop works before TLS
    # exists. The permanent block is in rattlewatch.rattled.ca.conf.
    location / {
        resolver 169.254.169.254 valid=300s ipv6=off;
        set $rw_api "verity-api-243195959173.us-central1.run.app";

        proxy_pass https://$rw_api;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;

        # Cloud Run routes by Host; the public hostname returns 404 upstream.
        proxy_set_header Host $rw_api;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
