# ===========================================================================
# RATTLEWATCH — access-log format and admin throttling (http context)
# ===========================================================================
#
# WHY A DEDICATED LOG
#   /etc/nginx/nginx.conf logs the stock "combined" format, which has no Host
#   field. The intel.rattled.ca honeypot shares this nginx and generates far
#   more traffic, so the shared log cannot separate the two. This vhost
#   therefore writes its own JSON log.
#
# WHY THE REQUEST BODY IS NOT LOGGED
#   We need to know whether an MCP request was an `initialize` handshake or a
#   real `tools/call`, but writing caller payloads to disk is a needless
#   retention risk. Instead the two maps below derive ONLY the JSON-RPC method
#   and the tool name from the body at log time. The body itself never reaches
#   the log, so no caller payload is retained.
#
#   $request_body is populated because nginx buffers proxied request bodies by
#   default (proxy_request_buffering is on). MCP payloads are well under
#   client_body_buffer_size, so they stay in memory.

map $request_body $rw_rpc_method {
    default                                 "";
    "~*\"method\"\s*:\s*\"([A-Za-z/]+)\""   $1;
}

# Only a tools/call carries a meaningful tool name; an `initialize` body also
# contains a "name" (the client's), which would otherwise be misread as a tool.
map $request_body $rw_is_toolcall {
    default                                 0;
    "~*\"method\"\s*:\s*\"tools/call\""     1;
}

map "$rw_is_toolcall:$request_body" $rw_tool_name {
    default                                 "";
    "~^1:.*\"name\"\s*:\s*\"([a-z_]+)\""    $1;
}

log_format rattlewatch_json escape=json
    '{'
      '"ts":"$time_iso8601",'
      '"ip":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"status":$status,'
      '"bytes":$body_bytes_sent,'
      '"rpc":"$rw_rpc_method",'
      '"tool":"$rw_tool_name",'
      '"ua":"$http_user_agent",'
      '"ref":"$http_referer",'
      '"rt":$request_time'
    '}';

# Brute-force throttle for the admin portal. The dashboard is a single
# self-contained HTML document, so one page view costs exactly one request.
limit_req_zone $binary_remote_addr zone=rw_admin:10m rate=30r/m;
